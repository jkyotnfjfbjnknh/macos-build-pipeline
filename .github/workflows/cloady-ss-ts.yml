name: cloady-ss-ts
on:
  push:
    paths:
      - 'cloady-ss-ts/**'
      - '.github/workflows/cloady-ss-ts.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: cloady-ss-ts
          push: true
          tags: ghcr.io/jkyotnfjfbjnknh/cloady-ss-ts:latest
